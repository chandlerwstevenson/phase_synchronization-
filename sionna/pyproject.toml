[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sionna-ota-sync"
version = "0.2.0"
description = "SDR-like OTA phase and frequency synchronization using NVIDIA Sionna"
requires-python = ">=3.11"
dependencies = ["sionna-no-rt==2.0.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
